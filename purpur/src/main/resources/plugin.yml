name: AfriTiersPurpur
version: '1.1.0'
main: net.afritiers.purpur.AfriTiersPurpur
api-version: '1.21.11'
depend: [packetevents]
softdepend: [AfriTiersLink, AuthMe]
commands:
  afritiers-settings:
    description: Your Afri-Tiers display and alert settings
  afritiers:
    description: Search a player's public tiers
  afritiersreload:
    description: Reload public rankings and configuration
  join-queue:
    description: Join an open Afri-Tiers queue
    usage: /join-queue <gamemode>
permissions:
  afritiers.purpur.reload:
    default: op
