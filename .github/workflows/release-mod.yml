name: Publish mod 2.8.6
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-mod-2.8.6
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Afri-TiersTagger-mc*
          path: release-builds
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify and publish mod-only release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: python3 tools/publish-mod-release.py
