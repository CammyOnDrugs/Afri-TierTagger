name: Publish mod 2.8.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-mod.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-mod-2.8.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Afri-TiersTagger-mc*
          path: release-builds
          github-token: ${{ github.token }}
          run-id: 40190654364
      - name: Verify and publish mod-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-mod-release.py
