name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1', java: '25' }
          - { minecraft: '26.1.1', java: '25' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
          - { minecraft: '26.3', java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew modern/gradlew
      - name: Build matching client
        run: |
          if [ '${{ matrix.minecraft }}' = '1.21.11' ]; then
            ./gradlew build --no-daemon --max-workers=2
          else
            cd modern
            ./gradlew -Pminecraft_version=${{ matrix.minecraft }} build --no-daemon --max-workers=2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Afri-TiersTagger-mc${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            modern/build/libs/*.jar
  velocity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: velocity/pom.xml
      - run: mvn -B -f velocity/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: AfriTiersVelocity
          path: velocity/target/AfriTiersVelocity-1.0.1.jar
  purpur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: purpur/pom.xml
      - run: mvn -B -f purpur/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: AfriTiersPurpur
          path: purpur/target/AfriTiersPurpur-1.1.0.jar
